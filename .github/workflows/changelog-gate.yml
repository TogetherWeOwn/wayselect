name: changelog-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog-gate:
    # TOG-7317: Unreleased-entry gate. Stdlib only, so no `npm ci`:
    # a PR touching src/, web/, bin/, or test/ must add one CHANGELOG.md
    # bullet under `## Unreleased` naming the TOG id (repo process:
    # CHANGELOG.md "Release-note process"). Docs-only, fixture-only, and
    # CHANGELOG-only PRs skip green. fetch-depth 0 is required: the script
    # diffs the PR branch against the base ref.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node bin/check-changelog-entry --base origin/${{ github.base_ref }} --head HEAD
