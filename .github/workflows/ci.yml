name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly ingestion smoke (TOG-5246): fixture-only, no network/credentials.
    - cron: "17 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x = engines floor; 24.x = latest LTS (active LTS since Oct 2025).
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: node bin/check-node-engines
      - run: npm ci
      - run: npm test

  ingestion-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node bin/check-node-engines
      - run: npm ci
      - run: npm run smoke
