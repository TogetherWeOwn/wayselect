name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly ingestion smoke (TOG-5246): fixture-only, no network/credentials.
    - cron: "17 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x = engines floor; 24.x = latest LTS (active LTS since Oct 2025).
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: node bin/check-node-engines
      - run: npm ci
      - run: npm test

  ingestion-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node bin/check-node-engines
      - run: npm ci
      - run: npm run smoke

  search-index-probe:
    # TOG-5722: R1-R5 search-index refresh probe, fixture-only, no network/credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:search-index

  large-catalog-bench:
    # TOG-7281: warn-only large-catalog benchmark measurement, fixture-only,
    # no network/credentials. Budgets stay enforced by
    # test/large-catalog-benchmark.test.js (the `test` job); this job only
    # publishes the timings JSON as an artifact. A budget miss warns, never
    # reds: the run step uses continue-on-error, the upload runs always with
    # if-no-files-found:warn, so even a crashing bench keeps this job green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # NOTE: `run:` leads each step below so the pre-push parity extractor
      # (test/pre-push-parity.test.js, `-\s*run:`) sees both steps — key
      # order is irrelevant to YAML/Actions. `shell: bash` selects
      # `bash -eo pipefail` so a bench exit 1 survives the `| tee` pipe;
      # the default `bash -e` would report tee's exit 0 and the warning
      # step below would never fire on a budget miss.
      - run: node bin/benchmark-large-catalog | tee ${{ runner.temp }}/large-catalog-timings.json
        id: bench
        continue-on-error: true
        shell: bash
      - run: echo "::warning::large-catalog benchmark over budget (warn-only; budgets enforced by test/large-catalog-benchmark.test.js)"
        if: steps.bench.outcome == 'failure'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-catalog-timings
          path: ${{ runner.temp }}/large-catalog-timings.json
          if-no-files-found: warn

  marker-gate:
    # TOG-7315: debt-marker introduction gate. Stdlib only, so no `npm ci`:
    # any newly added tracked marker word (see the word list in the script)
    # fails the run. This comment avoids spelling them: the gate scans it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bin/check-no-todo-markers

  audit:
    # TOG-7280: dependency audit gate — fails on a new high/critical
    # advisory. Needs the npm registry, so it is CI-only by design: the
    # offline local gate documents the exclusion (see bin/pre-push-check)
    # and test/pre-push-parity.test.js pins it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  e2e-staging-acceptance:
    # TOG-5722: CLI e2e staging acceptance, fixture-only, no network/credentials.
    # WAYSELECT_STAGING_ENDPOINT is intentionally unset so the publish step
    # runs as a local validator gate. fetch-depth 0 is required: the script
    # extracts its CLI/schema slices via `git archive origin/<ref>`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/e2e-staging-acceptance.mjs --out ${{ runner.temp }}/e2e-evidence.json
